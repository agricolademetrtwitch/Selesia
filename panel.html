<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=320">
<style>
*{box-sizing:border-box}
body{margin:0;background:#08080F;display:flex;justify-content:center;color:#fff;font-family:Inter,Arial,sans-serif}
.wrap{width:320px;padding:10px;background:#08080F}
.b{padding:8px 10px;background:#0E0E1A;border:0.5px solid #1A1A2E;border-left:2px solid #00F0FF;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.5px;text-align:center}
.pr{height:2px;background:#1A1A2E;margin:8px 0;border-radius:2px;overflow:hidden}
.pr div{height:100%;width:94.3%;background:#00F0FF}
.h{font-size:9px;color:#5A5A7A;margin:14px 0 6px;letter-spacing:1.2px;font-weight:700}
.g{display:grid;grid-template-columns:1fr 1fr;gap:4px}
button{background:#12121F;border:0.5px solid #1E1E32;color:#A0A0B8;padding:9px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;transition:.15s}
button:hover{background:#151525;border-color:#00F0FF40;color:#fff}
.f{grid-column:span 2;background:#00F0FF;color:#000;border:none;font-weight:800;letter-spacing:.5px}
.f:hover{background:#00E0EF;box-shadow:0 0 12px #00F0FF40}
</style>
</head>
<body>
<div class="wrap">
<div class="b">SILESIA — 1132 / 1200 — 68 LEFT</div>
<div class="pr"><div></div></div>
<div class="g"><button class="f" onclick="o('https://twitch.tv/Agricola_Demeter')">FOLLOW GOAL</button></div>
<div class="h">STEAM TOOLS</div>
<div class="g">
<button onclick="o('https://steamcommunity.com/id/agricolademeter/')">PROFILE</button>
<button onclick="o('https://steamcommunity.com/id/agricolademeter/inventory/')">INVENTORY</button>
<button onclick="o('https://steam.tools/itemvalue/')">VALUE</button>
<button onclick="o('https://vacbanned.com/search/agricolademeter')">VAC BAN</button>
</div>
<div class="h">FACEIT / CS2</div>
<div class="g">
<button onclick="o('https://www.faceit.com/en/players/agricolademeter')">FACEIT</button>
<button onclick="o('https://faceitfinder.com/players/agricolademeter')">ELO CHECK</button>
<button onclick="c('cl_crosshairsize 2; cl_crosshairgap -3')">CROSSHAIR</button>
<button onclick="c('bind f \'use weapon_knife; use weapon_flashbang\'')">BINDS</button>
</div>
<div class="h">SOCIAL</div>
<div class="g"><button class="f" onclick="o('https://instagram.com/agricolademetrtwitch')" style="background:transparent;border:0.5px solid #1E1E32;color:#A0A0B8">IG @agricolademetrtwitch</button></div>
</div>
<script>
function o(u){window.open(u,'_blank')}
function c(t){navigator.clipboard.writeText(t)}
</script>
</body>
</html>
