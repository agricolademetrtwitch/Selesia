<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body{background:#08080F;color:#fff;font-family:Orbitron,sans-serif;margin:0;padding:12px}
h2{color:#00F0FF;font-size:11px;margin:12px 0 6px;border-left:3px solid #00F0FF;padding-left:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{background:#12121F;border:1px solid #00F0FF40;color:#fff;padding:10px;border-radius:8px;font-size:11px;cursor:pointer;font-weight:bold}
button:hover{background:#00F0FF;color:#000;box-shadow:0 0 12px #00F0FF}
.full{grid-column:span 2}
.follow{background:linear-gradient(90deg,#00F0FF,#7000FF);border:none;font-size:12px;padding:12px}
.badge{background:linear-gradient(90deg,#00F0FF20,#7000FF20);border:1px solid #00F0FF;padding:8px;text-align:center;border-radius:8px;font-size:11px}
.prog{height:6px;background:#12121F;border-radius:3px;margin:6px 0;overflow:hidden}
.prog div{height:100%;background:linear-gradient(90deg,#00F0FF,#7000FF);width:94.3%}
</style>
</head>

<script>
let audio=new Audio('https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=click-124467.mp3');
function act(url){try{audio.currentTime=0;audio.play()}catch(e){} window.open(url,'_blank');}
function copy(t){try{audio.currentTime=0;audio.play()}catch(e){} navigator.clipboard.writeText(t); let n=document.createElement('div'); n.textContent='✓ Скопировано!'; n.style='position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#00F0FF;color:#000;padding:6px 12px;border-radius:4px;font-size:10px;z-index:999'; document.body.appendChild(n); setTimeout(()=>n.remove(),1500);}
</script>

</html>
