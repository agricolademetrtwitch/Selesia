<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SILESIA OBS OVERLAY</title>
<style>
*{box-sizing:border-box;margin:0}body{background:transparent;color:#fff;font-family:Montserrat,Arial,sans-serif;overflow:hidden;width:1920px;height:1080px;position:relative}
.obs-live-notif{position:absolute;display:none;align-items:center;gap:16px;padding:16px 28px;border-radius:50px;background:linear-gradient(90deg,#ff0000,#9147ff);box-shadow:0 0 40px rgba(255,0,0,.6),0 0 80px rgba(145,71,255,.4);border:3px solid #fff;animation:obsIn 0.6s cubic-bezier(0.68,-0.55,0.265,1.55),obsPulse 1.5s infinite 0.6s,obsOut 0.6s 7.4s forwards;min-width:400px;max-width:700px}
.obs-live-notif.show{display:flex}
.obs-live-notif.bottom-left{bottom:40px;left:40px}
.obs-live-notif.bottom-right{bottom:40px;right:40px}
.obs-live-notif.top-left{top:40px;left:40px}
.obs-live-notif.top-right{top:40px;right:40px}
.obs-live-notif.center{top:50%;left:50%;transform:translate(-50%,-50%)}
.obs-live-notif.center.show{animation:obsInCenter 0.6s cubic-bezier(0.68,-0.55,0.265,1.55),obsPulseCenter 1.5s infinite 0.6s,obsOutCenter 0.6s 7.4s forwards}
.obs-live-notif.silesia{background:linear-gradient(90deg,#FFD700,#FFA500);color:#000;border-color:#000;box-shadow:0 0 40px rgba(255,215,0,.6)}
.obs-live-notif.neon{background:linear-gradient(90deg,#9147ff,#772ce8);box-shadow:0 0 40px rgba(145,71,255,.8),0 0 80px rgba(145,71,255,.4)}
.obs-live-notif.minimal{background:#111;border:2px solid #333;box-shadow:0 0 20px rgba(0,0,0,.8)}
.obs-live-icon{width:64px;height:64px;background:#fff;color:#ff0000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;flex-shrink:0;animation:liveBlink 1s infinite}
.obs-live-content{flex:1}
.obs-live-name{font-size:22px;font-weight:800;display:flex;gap:8px;align-items:center}
.obs-live-title{font-size:14px;opacity:0.9;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px}
.obs-live-meta{font-size:11px;opacity:0.7;margin-top:2px;display:flex;gap:12px}
.obs-live-badge{background:#fff;color:#ff0000;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;animation:liveBlink 1s infinite}
.obs-live-viewers{display:flex;align-items:center;gap:4px}
@keyframes obsIn{from{transform:translateX(-100%) scale(0.5);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}
@keyframes obsInCenter{from{transform:translate(-50%,-50%) scale(0.5);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes obsOut{from{transform:translateX(0) scale(1);opacity:1}to{transform:translateX(-100%) scale(0.5);opacity:0}}
@keyframes obsOutCenter{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(-50%,-50%) scale(0.5);opacity:0}}
@keyframes obsPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes obsPulseCenter{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.03)}}
@keyframes liveBlink{50%{opacity:.5}}
</style>
</head>
<body>
<div class="obs-live-notif bottom-left" id="liveNotif">
<div class="obs-live-icon">🔴</div>
<div class="obs-live-content">
<div class="obs-live-name"><span id="obsName">Agricola</span> <span class="obs-live-badge">🔴 LIVE</span></div>
<div class="obs-live-title" id="obsTitle">SILESIA 1132/1200 — стрим!</div>
<div class="obs-live-meta"><span id="obsGame">🎮 Just Chatting</span> <span class="obs-live-viewers" id="obsViewers">👁️ 42</span></div>
</div>
</div>

<script>
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

let audioCtx=null;
function getAudioCtx(){if(audioCtx&&audioCtx.state!=='closed')return audioCtx;try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){audioCtx=null;}return audioCtx;}

const sounds={
 default:{freq1:880,freq2:440,duration:400},
 donate1:{freq1:1200,freq2:800,duration:300},
 donate2:{freq1:200,freq2:400,duration:800},
 shroud:{freq1:1500,freq2:300,duration:200},
 xqc:{freq1:600,freq2:1200,duration:600},
 agricola:{freq1:300,freq2:600,duration:500},
};

function playSound(key, customUrl){
 if(customUrl){
  const audio=new Audio(customUrl);
  audio.volume=0.6;
  audio.play().catch(()=>playSynth(sounds[key]||sounds.default));
  return;
 }
 playSynth(sounds[key]||sounds.default);
}

function playSynth(s){
 try{
  const ctx=getAudioCtx();
  if(!ctx) return;
  if(ctx.state==='suspended') ctx.resume();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type='sine';
  osc.frequency.value=s.freq1||880;
  gain.gain.value=0.3;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  setTimeout(()=>{try{osc.frequency.value=s.freq2||440;}catch(e){}},150);
  setTimeout(()=>{try{osc.stop();}catch(e){}},s.duration||400);
 }catch(e){}
}

function showNotif(data){
 const notif=document.getElementById('liveNotif');
 const name=document.getElementById('obsName');
 const title=document.getElementById('obsTitle');
 const game=document.getElementById('obsGame');
 const viewers=document.getElementById('obsViewers');

 // Load settings
 let settings={theme:'default',position:'bottom-left',duration:'8000',sound:true,tts:false,showGame:true,showViewers:false};
 try{settings=JSON.parse(localStorage.getItem('silesia_obs_settings')||'{"theme":"default","position":"bottom-left","duration":"8000","sound":true,"tts":false,"showGame":true,"showViewers":false}');}catch(e){}

 name.textContent=escapeHtml(data.displayName||data.login||'Unknown').slice(0,20);
 title.textContent=escapeHtml(data.title||'LIVE!').slice(0,60);
 game.textContent='🎮 '+(escapeHtml(data.game||'Just Chatting').slice(0,25));
 viewers.textContent='👁️ '+(data.viewers||0);

 // Theme
 notif.className='obs-live-notif '+settings.position+' '+settings.theme;
 notif.classList.add('show');

 // Visibility
 game.style.display=settings.showGame?'inline':'none';
 viewers.style.display=settings.showViewers?'inline':'none';

 // Sound
 if(settings.sound){
  const customSounds=JSON.parse(localStorage.getItem('silesia_custom_sounds')||'{}');
  const soundData=customSounds[data.sound];
  if(soundData&&soundData.url) playSound(data.sound, soundData.url);
  else playSound(data.sound||'default');
 }

 // TTS
 if(settings.tts&&'speechSynthesis' in window){
  try{
   const utter=new SpeechSynthesisUtterance((data.displayName||data.login)+' is now live!');
   utter.volume=0.6;
   utter.rate=1.1;
   speechSynthesis.speak(utter);
  }catch(e){}
 }

 // Duration
 const duration=parseInt(settings.duration)||8000;
 setTimeout(()=>{notif.classList.remove('show');},duration);
}

// Listen to localStorage events from panel.html
window.addEventListener('storage',e=>{
 if(e.key==='silesia_last_live_event'&&e.newValue){
  try{
   const data=JSON.parse(e.newValue);
   if(data&&data.time&&Date.now()-data.time<2000){
    showNotif(data);
   }
  }catch(err){}
 }
 if(e.key==='silesia_obs_settings_update'){
  // Settings updated, no action needed, will load on next notif
 }
});

// For testing via URL params: overlay.html?test=1&name=Agricola&title=SILESIA%20LIVE&game=Just%20Chatting
const params=new URLSearchParams(location.search);
if(params.get('test')==='1'){
 setTimeout(()=>{
  showNotif({login:'agricola_demeter',displayName:params.get('name')||'Agricola',title:params.get('title')||'SILESIA 1132/1200 — LIVE!',game:params.get('game')||'Just Chatting',viewers:params.get('viewers')||42,sound:params.get('sound')||'default'});
 },1000);
}

// If opened directly with ?streamers=agricola_demeter,shroud,xqc — poll localStorage? No, overlay is passive, panel must be open on same PC
// For remote use, need server — but for same PC, storage event works

// Keep alive for OBS
setInterval(()=>{},1000);
</script>
</body>
</html>
